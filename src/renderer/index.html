<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self'; img-src 'self' data:; font-src 'self'" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Tokenmeter</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <header class="topbar">
      <div class="brand">
        <svg class="logo" viewBox="0 0 32 32" aria-hidden="true" focusable="false">
          <rect width="32" height="32" rx="7.5" fill="#7aa2ff" />
          <g transform="rotate(135 16 17.5)" fill="none" stroke-width="4.2" stroke-linecap="round">
            <circle cx="16" cy="17.5" r="9.5" pathLength="100" stroke="#15171c" stroke-opacity="0.22" stroke-dasharray="75 25" />
            <circle cx="16" cy="17.5" r="9.5" pathLength="100" stroke="#15171c" stroke-dasharray="48 52" />
          </g>
          <circle cx="16" cy="17.5" r="2.6" fill="#15171c" />
        </svg>
        <div class="brand-text">
          <h1 class="app-title">Tokenmeter</h1>
          <!-- Fills toward the next API refresh; the exact times are in its tooltip and label. -->
          <svg id="refresh-ring" class="ring" viewBox="0 0 16 16" role="img" aria-label="Waiting for data">
            <title id="refresh-ring-title">Waiting for data</title>
            <circle class="ring-track" cx="8" cy="8" r="6" />
            <circle id="refresh-ring-fill" class="ring-fill" cx="8" cy="8" r="6" pathLength="100" />
          </svg>
        </div>
      </div>
      <div class="actions">
        <button id="btn-add" class="icon" title="Add tool" aria-label="Add tool" aria-expanded="false" aria-controls="tool-picker">
          <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M12 5v14M5 12h14" /></svg>
        </button>
        <button id="btn-refresh" class="icon" title="Refresh now" aria-label="Refresh now">
          <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M20 11a8 8 0 1 0-2.3 5.7M20 4v7h-7" /></svg>
        </button>
        <button id="btn-pin" class="icon" title="Always on top" aria-label="Always on top" aria-pressed="false">
          <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M12 17v5M9 10.76a2 2 0 0 1-1.11 1.79l-1.78.9A2 2 0 0 0 5 15.24V16a1 1 0 0 0 1 1h12a1 1 0 0 0 1-1v-.76a2 2 0 0 0-1.11-1.79l-1.78-.9A2 2 0 0 1 15 10.76V7a1 1 0 0 1 1-1 2 2 0 0 0 0-4H8a2 2 0 0 0 0 4 1 1 0 0 1 1 1z" /></svg>
        </button>
        <button id="btn-settings" class="icon" title="Settings" aria-label="Settings">
          <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false"><circle cx="12" cy="12" r="3" /><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z" /></svg>
        </button>
        <button id="btn-hide" class="icon" title="Hide to tray" aria-label="Hide to tray">
          <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M6 6l12 12M18 6L6 18" /></svg>
        </button>
      </div>
    </header>

    <div id="demo-banner" class="banner" hidden>Sample data (demo mode)</div>

    <div id="toolbar" class="toolbar">
      <div id="density" class="seg" role="radiogroup" aria-label="Card size">
        <button type="button" role="radio" data-density="compact" aria-checked="false" aria-label="Compact" title="Compact">
          <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false"><rect x="3.5" y="3.5" width="4.5" height="4.5" rx="1" /><rect x="9.75" y="3.5" width="4.5" height="4.5" rx="1" /><rect x="16" y="3.5" width="4.5" height="4.5" rx="1" /><rect x="3.5" y="9.75" width="4.5" height="4.5" rx="1" /><rect x="9.75" y="9.75" width="4.5" height="4.5" rx="1" /><rect x="16" y="9.75" width="4.5" height="4.5" rx="1" /><rect x="3.5" y="16" width="4.5" height="4.5" rx="1" /><rect x="9.75" y="16" width="4.5" height="4.5" rx="1" /><rect x="16" y="16" width="4.5" height="4.5" rx="1" /></svg>
        </button>
        <button type="button" role="radio" data-density="normal" aria-checked="true" aria-label="Normal" title="Normal">
          <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false"><rect x="4" y="4" width="7" height="7" rx="1.5" /><rect x="13" y="4" width="7" height="7" rx="1.5" /><rect x="4" y="13" width="7" height="7" rx="1.5" /><rect x="13" y="13" width="7" height="7" rx="1.5" /></svg>
        </button>
        <button type="button" role="radio" data-density="detailed" aria-checked="false" aria-label="Detailed" title="Detailed">
          <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false"><rect x="4" y="4" width="16" height="7" rx="1.5" /><rect x="4" y="13" width="16" height="7" rx="1.5" /></svg>
        </button>
      </div>
      <!-- On: cards closest to a limit come first. Off: your own (dragged) order. -->
      <button type="button" id="btn-sort" class="sort" aria-pressed="true" aria-label="Sort by nearest limit">
        <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="m3 16 4 4 4-4M7 20V4M11 4h10M11 8h7M11 12h4" /></svg>
      </button>
    </div>

    <div id="announcer" class="sr-only" role="status" aria-live="polite" aria-atomic="true"></div>

    <main id="cards" class="cards" aria-label="Usage by provider"></main>

    <section id="settings" class="settings" hidden>
      <form id="settings-form" autocomplete="off">
        <h2 tabindex="-1">Settings</h2>

        <fieldset>
          <legend>General</legend>
          <label class="row">Refresh API data every
            <span class="inline"><input type="number" name="pollMinutes" min="1" max="120" step="1" /> min</span>
          </label>
          <label class="check"><input type="checkbox" name="alwaysOnTop" /> Always on top</label>
          <label class="check"><input type="checkbox" name="autoFit" /> Fit window height to its content</label>
          <label class="check"><input type="checkbox" name="startAtLogin" /> Start at login</label>
          <label class="check"><input type="checkbox" name="forceX11" /> Use XWayland on Wayland (needed for always-on-top; restart to apply)</label>
          <label class="row">Theme
            <select name="theme">
              <option value="system">Follow system</option>
              <option value="dark">Dark</option>
              <option value="light">Light</option>
            </select>
          </label>
          <label class="row">Opacity <input type="range" name="opacity" min="0.4" max="1" step="0.05" aria-describedby="opacity-val" /><output id="opacity-val" class="muted"></output></label>
          <p id="enc-status" class="hint"></p>
        </fieldset>

        <div id="provider-fields"></div>

        <div class="form-actions">
          <button type="button" id="btn-cancel" class="ghost">Cancel</button>
          <button type="submit" class="primary">Save</button>
        </div>
      </form>
    </section>

    <script src="app.js"></script>
  </body>
</html>
